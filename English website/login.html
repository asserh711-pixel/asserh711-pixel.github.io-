<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - أكاديمية عبدالعزيز</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-gray-800 antialiased min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-8 w-full max-w-md">
    
    <div class="text-center mb-8">
      <div class="w-20 h-20 rounded-full border-4 border-blue-600 mx-auto overflow-hidden mb-3 bg-blue-50 flex items-center justify-center text-3xl">
        🔑
      </div>
      <h1 class="text-2xl font-bold text-gray-800">تسجيل الدخول للمنصة</h1>
      <p class="text-gray-500 text-sm mt-1">أدخل بياناتك للدخول إالي المنصة</p>
    </div>

    <form onsubmit="handleLogin(event)" class="space-y-5">
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-2">رقم الموبايل</label>
        <input type="tel" id="loginPhone" required maxlength="11"  class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 text-right transition">
      </div>

      <div>
        <label class="block text-sm font-bold text-gray-700 mb-2">كلمة المرور</label>
        <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 text-right transition">
      </div>

      <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl hover:bg-blue-700 transition shadow-md shadow-blue-200 text-base">
        دخول المنصة 🚀
      </button>
    </form>

    <div class="mt-6 text-center border-t border-gray-100 pt-4">
      <p class="text-sm text-gray-600">ليس لديك حساب؟ 
        <a href="register.html" class="font-bold text-blue-600 hover:underline">إنشاء حساب جديد ✨</a>
      </p>
    </div>

  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      
      const enteredPhone = document.getElementById('loginPhone').value.trim();
      const enteredPassword = document.getElementById('loginPassword').value.trim();

      // جلب قائمة كافة الحسابات
      const users = JSON.parse(localStorage.getItem("academyUsers")) || [];

      // البحث عن الحساب المطابق لرقم الموبايل وكلمة المرور
      const matchedUser = users.find(u => u.phone === enteredPhone && u.password === enteredPassword);

      if (matchedUser) {
        // حفظ بيانات تسجيل الدخول وتوفير كافة المسميات الاحتياطية لربط النتائج بدقة
        localStorage.setItem("isLoggedIn", "true");
        localStorage.setItem("studentName", matchedUser.name);
        localStorage.setItem("currentStudent", JSON.stringify(matchedUser));
        localStorage.setItem("studentData", JSON.stringify(matchedUser));
        
      
        window.location.href = 'index.html';
      } else {
        const phoneExists = users.some(u => u.phone === enteredPhone);
        if (phoneExists) {
          alert('❌ كلمة المرور غير صحيحة، يرجى المحاولة مرة أخرى.');
        } else {
          alert('⚠️ عذراً، لا يوجد حساب مسجل بهذا الرقم! يرجى إنشاء حساب جديد أولاً.');
        }
      }
    }
  </script>

</body>
</html>
