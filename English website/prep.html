<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المرحلة الإعدادية - أكاديمية عبدالعزيز</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style> 
    body { 
      font-family: 'Cairo', sans-serif; 
      /* نفس خلفية الرئيسية بالضبط */
      background-image: linear-gradient(rgba(248, 250, 252, 0.85), rgba(248, 250, 252, 0.9)), url('bg.jpg'); 
      background-size: cover; 
      background-position: center; 
      background-attachment: fixed; 
    } 
  </style>

  <!-- كود الحماية والتحقق من تسجيل الدخول -->
  <script>
    if (localStorage.getItem("isLoggedIn") !== "true") {
      window.location.href = "login.html";
    }
  </script>
</head>
<body class="text-gray-800 antialiased min-h-screen">

  <!-- الهيدر -->
  <header class="bg-blue-600/90 backdrop-blur-md text-white py-6 px-4 shadow-lg border-b border-blue-500/30">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold flex items-center gap-2">
        📘 المرحلة الإعدادية
      </h1>
      <a href="index.html" class="bg-white text-blue-600 px-4 py-2 rounded-lg font-bold text-sm hover:bg-blue-50 transition shadow">
        ⬅️ العودة للرئيسية
      </a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8 space-y-8">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-4">اختر الصف الدراسي</h2>

    <!-- أزرار الصفوف الإعدادية -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <button onclick="loadPrepLessons('1')" class="bg-white/80 backdrop-blur-sm p-4 rounded-xl shadow-sm border border-white/60 hover:border-blue-600 font-bold text-lg text-gray-700 hover:text-blue-600 transition">
        الصف الأول الإعدادي
      </button>
      <button onclick="loadPrepLessons('2')" class="bg-white/80 backdrop-blur-sm p-4 rounded-xl shadow-sm border border-white/60 hover:border-blue-600 font-bold text-lg text-gray-700 hover:text-blue-600 transition">
        الصف الثاني الإعدادي
      </button>
      <button onclick="loadPrepLessons('3')" class="bg-white/80 backdrop-blur-sm p-4 rounded-xl shadow-sm border border-white/60 hover:border-blue-600 font-bold text-lg text-gray-700 hover:text-blue-600 transition">
        الصف الثالث الإعدادي
      </button>
    </div>

    <!-- مكان عرض الدروس المضافة -->
    <section id="lessonsContainer" class="space-y-6 pt-6">
      <div class="text-center text-gray-500 font-semibold py-8 bg-white/60 backdrop-blur-sm rounded-2xl border border-white/60">
        اضغط على الصف الدراسي بالأعلى لعرض الدروس المضافة 👆
      </div>
    </section>

  </main>

  <!-- مكتبات Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    // إعدادات Firebase الخاصة بالمشروع
    const firebaseConfig = {
      apiKey: "AIzaSyBBKKh7XeQv0k12fXq4NyFy18AVg9wEqyE",
      authDomain: "abdelaziz-academy-c1196.firebaseapp.com",
      projectId: "abdelaziz-academy-c1196",
      storageBucket: "abdelaziz-academy-c1196.firebasestorage.app",
      messagingSenderId: "955955108448",
      appId: "1:955955108448:web:0ff8be1fe9fb51c4f08105"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // دالة تحويل رابط يوتيوب إلى Embed
    function formatYoutubeUrl(url) {
      if(!url) return '';
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}` : url;
    }

    // دالة عرض الدروس الخاصة بالإعدادي من Firebase
    function loadPrepLessons(gradeNumber) {
      const container = document.getElementById('lessonsContainer');
      
      // إظهار مؤشر التحميل
      container.innerHTML = `
        <div class="text-center text-blue-600 font-bold py-8 bg-white/80 backdrop-blur-sm rounded-2xl border border-white/60">
          ⏳ جاري تحميل الدروس من السيرفر...
        </div>`;

      // جلب البيانات مباشرة من قاعدة بيانات Firebase
      db.collection("lessons")
        .where("stage", "==", "prep")
        .where("grade", "==", gradeNumber.toString())
        .get()
        .then((querySnapshot) => {
          if (querySnapshot.empty) {
            container.innerHTML = `
              <div class="bg-white/80 backdrop-blur-sm p-8 rounded-2xl text-center text-gray-600 border border-white/60">
                لا توجد دروس مضافة لهذا الصف حتى الآن 📭
              </div>`;
            return;
          }

          let html = '';
          querySnapshot.forEach((doc) => {
            const lesson = doc.data();
            html += `
              <div class="bg-white/80 backdrop-blur-sm p-6 rounded-2xl shadow-sm border border-white/60 space-y-4">
                <h3 class="text-xl font-bold text-gray-800 border-r-4 border-blue-600 pr-3">${lesson.title}</h3>
                
                ${lesson.videoUrl ? `
                  <div class="aspect-video bg-black rounded-xl overflow-hidden shadow-inner">
                    <iframe class="w-full h-full" src="${formatYoutubeUrl(lesson.videoUrl)}" frameborder="0" allowfullscreen></iframe>
                  </div>
                ` : ''}

                <div class="flex flex-wrap items-center justify-between gap-4 bg-gray-50/80 p-4 rounded-xl border border-gray-100">
                  <span class="font-bold text-sm text-gray-700">مرفقات الدرس:</span>
                  <div class="flex gap-3">
                    ${lesson.pdfUrl ? `
                      <a href="${lesson.pdfUrl}" target="_blank" class="bg-emerald-600 text-white px-4 py-2 rounded-lg font-bold text-sm hover:bg-emerald-700 transition">
                        📄 تحميل المذكرة (PDF)
                      </a>
                    ` : '<span class="text-xs text-gray-400">لا يوجد ملزمة مرفقة</span>'}
                  </div>
                </div>
              </div>
            `;
          });

          container.innerHTML = html;
        })
        .catch((error) => {
          console.error("خطأ أثناء استدعاء البيانات: ", error);
          container.innerHTML = `
            <div class="bg-red-50 text-red-600 p-6 rounded-2xl text-center font-bold border border-red-200">
              حدث خطأ أثناء تحميل الدروس، يرجى المحاولة لاحقاً.
            </div>`;
        });
    }
  </script>

</body>
</html>
