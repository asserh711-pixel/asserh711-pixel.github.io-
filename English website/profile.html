<!DOCTYPE html> 
<html lang="ar" dir="rtl"> 
<head> 
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>نتائج الاختبارات - أكاديمية عبدالعزيز</title> 
  <!-- Tailwind CSS --> 
  <script src="https://cdn.tailwindcss.com"></script> 
  <!-- خط Cairo --> 
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"> 
  <style> 
    body { 
      font-family: 'Cairo', sans-serif; 
      background-image: linear-gradient(rgba(248, 250, 252, 0.85), rgba(248, 250, 252, 0.9)), url('bg.jpg'); 
      background-size: cover; 
      background-position: center; 
      background-attachment: fixed; 
    } 
    #tabsContainer::-webkit-scrollbar { display: none; }
    #tabsContainer { -ms-overflow-style: none; scrollbar-width: none; }
  </style> 

  <!-- كود الحماية والتحقق من تسجيل الدخول -->
  <script>
    if (localStorage.getItem("isLoggedIn") !== "true") {
      window.location.href = "login.html";
    }

    // دالة تسجيل الخروج المحدثة (تحافظ على قاعدة بيانات الحسابات academyUsers)
    function logout() {
      localStorage.removeItem("isLoggedIn");
      localStorage.removeItem("studentName");
      localStorage.removeItem("studentData");
      localStorage.removeItem("currentStudent");
      window.location.href = "login.html";
    }
  </script>
</head> 
<body class="text-gray-800 antialiased min-h-screen flex flex-row-reverse"> 

  <!-- 1. القائمة الجانبية (Sidebar) الثابتة على اليمين -->
  <aside class="w-64 bg-blue-600 text-white min-h-screen p-6 flex flex-col justify-between shadow-2xl fixed top-0 right-0 z-50">
    <div>
      <div class="flex items-center gap-3 mb-8 pb-4 border-b border-blue-500">
        <div class="w-12 h-12 rounded-full bg-white text-blue-600 flex items-center justify-center text-2xl font-bold shadow">
          📚
        </div>
        <div>
          <h2 class="font-extrabold text-lg">أكاديمية عبدالعزيز</h2>
          <span class="text-xs text-blue-200">منصة اللغة الإنجليزية</span>
        </div>
      </div>

      <nav class="space-y-2">
        <a href="index.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-blue-700/60 text-blue-100 font-medium transition">
          🏠 الرئيسية
        </a>
        <a href="exams.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-blue-700/60 text-blue-100 font-medium transition">
          📝 الامتحانات الإلكترونية
        </a>
        <a href="profile.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-blue-700 text-white font-bold transition shadow-sm">
          👤 حسابي
        </a>
        <a href="admin.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-blue-700/60 text-blue-100 font-medium transition">
          ⚙️ لوحة التحكم
        </a>
      </nav>
    </div>

    <div>
      <button onclick="logout()" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-3 rounded-xl transition flex items-center justify-center gap-2 shadow">
        🚪 تسجيل الخروج
      </button>
    </div>
  </aside>

  <!-- 2. المحتوى الرئيسي للموقع -->
  <div class="flex-1 mr-64 min-h-screen flex flex-col">
    
    <!-- هيدر علوي -->
    <header class="bg-white/80 backdrop-blur-md shadow-sm border-b border-gray-100 py-4 px-8 flex justify-between items-center">
      <h1 class="text-xl font-extrabold text-gray-800">نتائج الاختبارات</h1>
      <div id="studentHeaderName" class="text-sm font-bold text-blue-600 bg-blue-50 px-4 py-2 rounded-xl border border-blue-100">
        جاري التحميل...
      </div>
    </header>

    <!-- 3. شريط التبويبات الأفقي بالأسهم (زر نتائج الاختبارات مفعل) -->
    <div class="max-w-6xl mx-auto px-6 mt-6 w-full">
      <div class="bg-white/90 backdrop-blur-md rounded-2xl shadow-sm border border-gray-200/80 p-2 flex items-center justify-between relative overflow-hidden">
        
        <button onclick="scrollTabs('right')" class="bg-gray-50 hover:bg-gray-100 text-gray-600 p-2.5 rounded-xl shadow-sm z-10 flex items-center justify-center border border-gray-200 transition font-bold">
          ◀
        </button>

        <div id="tabsContainer" class="flex items-center gap-2 overflow-x-auto px-2 py-1 whitespace-nowrap scroll-smooth flex-1 mx-2">
          <a href="profile.html" class="px-5 py-2.5 rounded-xl bg-gray-50 hover:bg-gray-100 text-gray-600 font-medium text-sm transition">الصفحة الرئيسية</a>
          <a href="profile.html" class="px-5 py-2.5 rounded-xl bg-blue-600 text-white font-bold text-sm shadow-sm transition">نتائج الاختبارات</a>
        </div>

        <button onclick="scrollTabs('left')" class="bg-gray-50 hover:bg-gray-100 text-gray-600 p-2.5 rounded-xl shadow-sm z-10 flex items-center justify-center border border-gray-200 transition font-bold">
          ▶
        </button>

      </div>
    </div>

    <!-- محتوى النتائج -->
    <main class="max-w-6xl mx-auto px-6 py-6 space-y-6 flex-1 w-full"> 
      
      <div class="bg-white/90 backdrop-blur-md rounded-3xl p-8 shadow-sm border border-gray-100">
        <h2 class="text-xl font-bold text-gray-800 mb-6 flex items-center gap-2">
          📊 سجل درجات الامتحانات السابقة
        </h2>

        <!-- جدول أو حاوية عرض النتائج -->
        <div class="overflow-x-auto">
          <table class="w-full text-right border-collapse">
            <thead>
              <tr class="border-b border-gray-200 text-gray-500 text-sm">
                <th class="py-3 px-4 font-bold">اسم الامتحان</th>
                <th class="py-3 px-4 font-bold">التاريخ</th>
                <th class="py-3 px-4 font-bold">الدرجة الحاصل عليها</th>
                <th class="py-3 px-4 font-bold">الحالة</th>
              </tr>
            </thead>
            <tbody id="examResultsTable" class="divide-y divide-gray-100 text-sm">
              <!-- يتم تعبئة النتائج ديناميكياً أو تظهر رسالة في حال عدم وجود امتحانات -->
              <tr>
                <td colspan="4" class="py-8 text-center text-gray-400 font-medium">
                  لم تقم بأي امتحانات حتى الآن 📭
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <!-- سكربت التحكم في الأسهم وجلب البيانات -->
  <script>
    function scrollTabs(direction) {
      const container = document.getElementById('tabsContainer');
      const scrollAmount = 250;
      if (direction === 'left') {
        container.scrollLeft -= scrollAmount;
      } else {
        container.scrollLeft += scrollAmount;
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      // جلب بيانات الطالب المحدثة
      const savedData = localStorage.getItem("currentStudent") || localStorage.getItem("studentData");
      let studentPhone = "";
      let studentName = "الطالب";
      
      if (savedData) {
        const student = JSON.parse(savedData);
        studentName = student.name || "الطالب";
        studentPhone = student.phone || "";
        document.getElementById('studentHeaderName').innerText = studentName;
      } else {
        const sName = localStorage.getItem("studentName");
        if (sName) {
          studentName = sName;
          document.getElementById('studentHeaderName').innerText = studentName;
        } else {
          document.getElementById('studentHeaderName').innerText = "حساب الطالب";
        }
      }

      // جلب نتائج الامتحانات الخاصة بهذا الطالب فقط حصرياً بناءً على رقم هاتفه أو اسمه
      let examResults = [];
      const identifier = studentPhone || studentName;
      if (identifier) {
        const studentKey = "examResults_" + identifier.replace(/\s+/g, '_');
        examResults = JSON.parse(localStorage.getItem(studentKey)) || [];
      }

      const tbody = document.getElementById('examResultsTable');

      if (examResults.length > 0) {
        tbody.innerHTML = "";
        examResults.forEach(exam => {
          tbody.innerHTML += `
            <tr class="hover:bg-gray-50/50 transition">
              <td class="py-4 px-4 font-bold text-gray-800">${exam.title}</td>
              <td class="py-4 px-4 text-gray-500">${exam.date}</td>
              <td class="py-4 px-4 font-extrabold text-blue-600">${exam.score} / ${exam.total}</td>
              <td class="py-4 px-4"><span class="bg-emerald-50 text-emerald-600 px-3 py-1 rounded-full text-xs font-bold">اجتياز</span></td>
            </tr>
          `;
        });
      } else {
        tbody.innerHTML = `
          <tr>
            <td colspan="4" class="py-8 text-center text-gray-400 font-medium">
              لم تقم بأي امتحانات حتى الآن 📭
            </td>
          </tr>
        `;
      }
    });
  </script>

</body> 
</html>
