<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب جديد - أكاديمية عبدالعزيز</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-gray-800 antialiased min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-8 w-full max-w-md">
    
    <div class="text-center mb-8">
      <div class="w-20 h-20 rounded-full border-4 border-emerald-600 mx-auto overflow-hidden mb-3 bg-emerald-50 flex items-center justify-center text-3xl">
        ✨
      </div>
      <h1 class="text-2xl font-bold text-gray-800">حساب جديد </h1>
      <p class="text-gray-500 text-sm mt-1">سجل بياناتك للانضمام إلينا </p>
    </div>

    <form onsubmit="handleRegister(event)" class="space-y-4">
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1">الاسم الكامل</label>
        <input type="text" id="fullName"  class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-100 text-right transition">
      </div>

      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1">رقم الموبايل </label>
        <input type="tel" id="regPhone" required maxlength="11" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-100 text-right transition">
      </div>

      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1">المرحلة الدراسية</label>
        <select id="regStage" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-100 text-right bg-white transition">
          <option value="الأول الإعدادي">الأول الإعدادي</option>
          <option value="الثاني الإعدادي">الثاني الإعدادي</option>
          <option value="الثالث الإعدادي">الثالث الإعدادي</option>
          <option value="الأول الثانوي">الأول الثانوي</option>
          <option value="الثاني الثانوي">الثاني الثانوي</option>
          <option value="الثالث الثانوي">الثالث الثانوي</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1">كلمة المرور</label>
        <input type="password" id="regPassword" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-100 text-right transition">
      </div>

      <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl hover:bg-emerald-700 transition shadow-md shadow-emerald-200 text-base mt-2">
        إنشاء الحساب 🚀
      </button>
    </form>

    <div class="mt-6 text-center border-t border-gray-100 pt-4">
      <a href="login.html" class="text-sm font-bold text-gray-600 hover:text-blue-600">
        ⬅️ لديك حساب بالفعل؟ تسجيل الدخول
      </a>
    </div>

  </div>

  <script>
    function handleRegister(e) {
      e.preventDefault();
      
      const name = document.getElementById('fullName').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const stage = document.getElementById('regStage').value;
      const password = document.getElementById('regPassword').value;

      if (phone.length !== 11 || isNaN(phone)) {
        alert('⚠️ خطأ: يجب أن يتكون رقم الموبايل من 11 رقم صحيح!');
        return;
      }

      // جلب مصفوفة الحسابات المسجلة سابقاً
      let users = JSON.parse(localStorage.getItem("academyUsers")) || [];

      // التحقق مما إذا كان الرقم مسجلاً من قبل
      const userExists = users.some(u => u.phone === phone);
      if (userExists) {
        alert('⚠️ هذا الرقم مسجل بالفعل! يمكنك الانتقال لتسجيل الدخول مباشرة.');
        window.location.href = 'login.html';
        return;
      }

      // إضافة الحساب الجديد للحافظة
      const newUser = { name, phone, stage, password };
      users.push(newUser);

      // حفظ المصفوفة المحدثة
      localStorage.setItem("academyUsers", JSON.stringify(users));

      alert(' تم إنشاء الحساب بنجاح! يرجى تسجيل الدخول برقم الموبايل وكلمة المرور.');
      window.location.href = 'login.html';
    }
  </script>

</body>
</html>
