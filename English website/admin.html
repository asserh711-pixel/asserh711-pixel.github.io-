<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - إدارة الدروس والامتحانات - أكاديمية عبدالعزيز</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-slate-100 text-gray-800 antialiased min-h-screen p-4 md:p-8">

  <div class="max-w-3xl mx-auto space-y-8">
    
    <!-- الهيدر والتبويبات -->
    <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-6">
      <div class="flex items-center justify-between border-b border-gray-100 pb-4 mb-6">
        <h1 class="text-2xl font-bold text-gray-800">⚙️ لوحة تحكم المنصة</h1>
        <div class="flex gap-2">
          <a href="exams.html" class="bg-blue-50 text-blue-600 px-3 py-2 rounded-lg font-bold text-sm hover:bg-blue-100 transition">معاينة الامتحانات 📝</a>
          <a href="index.html" class="bg-gray-100 text-gray-700 px-3 py-2 rounded-lg font-bold text-sm hover:bg-gray-200 transition">الموقع 🌐</a>
        </div>
      </div>

      <!-- أزرار التنقل -->
      <div class="flex gap-4">
        <button onclick="switchTab('lessons')" id="tabLessonsBtn" class="flex-1 py-3 font-bold rounded-xl bg-blue-600 text-white transition">📚 إدارة الدروس</button>
        <button onclick="switchTab('exams')" id="tabExamsBtn" class="flex-1 py-3 font-bold rounded-xl bg-gray-100 text-gray-600 transition">📝 إدارة الامتحانات</button>
      </div>
    </div>

    <!-- ================= 1. قسم الدروس ================= -->
    <div id="lessonsTab" class="space-y-8">
      
      <!-- نموذج إضافة درس -->
      <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-6 md:p-8 space-y-6">
        <h2 class="text-xl font-bold text-gray-800">➕ إضافة درس جديد</h2>
        <form onsubmit="saveLesson(event)" class="space-y-4">
          <div class="grid grid-cols-2 gap-4">
            <select id="stage" required class="px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 font-bold">
              <option value="">اختر المرحلة...</option>
              <option value="prep">إعدادي</option>
              <option value="secondary">ثانوي</option>
            </select>
            <select id="grade" required class="px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 font-bold">
              <option value="">اختر الصف...</option>
              <option value="1">الصف الأول</option>
              <option value="2">الصف الثاني</option>
              <option value="3">الصف الثالث</option>
            </select>
          </div>
          <input type="text" id="title" required placeholder="عنوان الدرس" class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50">
          <input type="url" id="videoUrl" placeholder="رابط فيديو اليوتيوب" class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50">
          <input type="url" id="pdfUrl" placeholder="رابط ملزمة PDF" class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50">
          <button type="submit" id="saveLessonBtn" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition">💾 حفظ الدرس السحابي</button>
        </form>
      </div>

      <!-- قائمة الدروس المضافة وحذفها -->
      <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-6 md:p-8">
        <h2 class="text-xl font-bold text-gray-800 border-b border-gray-100 pb-4 mb-6">📚 الدروس المضافة أونلاين</h2>
        <div id="adminLessonsList" class="space-y-3">
          <!-- تحميل الدروس وزر الحذف -->
        </div>
      </div>

    </div>

    <!-- ================= 2. قسم الامتحانات ================= -->
    <div id="examsTab" class="hidden space-y-8">
      
      <!-- نموذج إنشاء امتحان -->
      <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-6 md:p-8 space-y-6">
        <h2 class="text-xl font-bold text-gray-800">➕ إنشاء امتحان جديد</h2>
        
        <form onsubmit="saveExam(event)" class="space-y-6">
          <div class="grid grid-cols-2 gap-4">
            <select id="examStageInput" required class="px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 font-bold">
              <option value="">اختر المرحلة...</option>
              <option value="prep">إعدادي</option>
              <option value="secondary">ثانوي</option>
            </select>
            <select id="examGradeInput" required class="px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 font-bold">
              <option value="">اختر الصف...</option>
              <option value="1">الصف الأول</option>
              <option value="2">الصف الثاني</option>
              <option value="3">الصف الثالث</option>
            </select>
          </div>

          <input type="text" id="examTitle" required placeholder="عنوان الامتحان (مثال: Quiz 1 - Unit 1)" class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50">

          <!-- الأسئلة -->
          <div id="questionsContainer" class="space-y-6">
            <!-- كروت الأسئلة تنزل هنا -->
          </div>

          <button type="button" onclick="addQuestionField()" class="w-full bg-gray-50 text-gray-700 font-bold py-3 rounded-xl hover:bg-gray-100 transition border border-dashed border-gray-300">
            ➕ إضافة سؤال جديد
          </button>

          <button type="submit" id="saveExamBtn" class="w-full bg-emerald-600 text-white font-bold py-3.5 rounded-xl hover:bg-emerald-700 transition">
            🚀 نشر الامتحان للطلاب السحابي
          </button>
        </form>
      </div>

      <!-- قائمة الامتحانات المضافة وحذفها -->
      <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-6 md:p-8">
        <h2 class="text-xl font-bold text-gray-800 border-b border-gray-100 pb-4 mb-6">📝 الامتحانات المضافة أونلاين</h2>
        <div id="adminExamsList" class="space-y-3">
          <!-- تحميل الامتحانات وزر الحذف -->
        </div>
      </div>

    </div>

  </div>

  <!-- مكتبات Firebase SDKs (نسخة Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    // 🔒 حماية لوحة التحكم بكلمة سر
    const password = prompt("برجاء إدخال كلمة سر لوحة التحكم:");
    if (password !== "3MK EL 7AWY AsserM109") {
      alert("كلمة السر غير صحيحة!");
      window.location.href = "index.html";
    }

    // إعدادات Firebase الخاصة بالمشروع
    const firebaseConfig = {
      apiKey: "AIzaSyBBKKh7XeQv0k12fXq4NyFy18AVg9wEqyE",
      authDomain: "abdelaziz-academy-c1196.firebaseapp.com",
      projectId: "abdelaziz-academy-c1196",
      storageBucket: "abdelaziz-academy-c1196.firebasestorage.app",
      messagingSenderId: "955955108448",
      appId: "1:955955108448:web:0ff8be1fe9fb51c4f08105"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const stageNames = { prep: 'إعدادي', secondary: 'ثانوي' };

    // التنقل بين التبويبات
    function switchTab(tab) {
      if (tab === 'lessons') {
        document.getElementById('lessonsTab').classList.remove('hidden');
        document.getElementById('examsTab').classList.add('hidden');
        document.getElementById('tabLessonsBtn').className = "flex-1 py-3 font-bold rounded-xl bg-blue-600 text-white transition";
        document.getElementById('tabExamsBtn').className = "flex-1 py-3 font-bold rounded-xl bg-gray-100 text-gray-600 transition";
      } else {
        document.getElementById('lessonsTab').classList.add('hidden');
        document.getElementById('examsTab').classList.remove('hidden');
        document.getElementById('tabExamsBtn').className = "flex-1 py-3 font-bold rounded-xl bg-blue-600 text-white transition";
        document.getElementById('tabLessonsBtn').className = "flex-1 py-3 font-bold rounded-xl bg-gray-100 text-gray-600 transition";
      }
    }

    /* ----------- 1. وظائف الدروس السحابية ----------- */
    function saveLesson(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('saveLessonBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = "⏳ جاري الحفظ على السيرفر...";

      const newLesson = {
        stage: document.getElementById('stage').value,
        grade: document.getElementById('grade').value,
        title: document.getElementById('title').value,
        videoUrl: document.getElementById('videoUrl').value,
        pdfUrl: document.getElementById('pdfUrl').value,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      db.collection("lessons").add(newLesson)
        .then(() => {
          alert('تم حفظ الدرس أونلاين بنجاح! 🎉');
          e.target.reset();
          renderAdminLessons();
        })
        .catch((error) => {
          console.error("خطأ في الحفظ: ", error);
          alert('❌ حدث خطأ، تأكد من اتصال الإنترنت أو قواعد (Rules) الفايربيس!');
        })
        .finally(() => {
          submitBtn.disabled = false;
          submitBtn.innerText = "💾 حفظ الدرس السحابي";
        });
    }

    function renderAdminLessons() {
      const container = document.getElementById('adminLessonsList');
      container.innerHTML = '<div class="text-center text-gray-400 py-4">⏳ جاري جلب الدروس من السيرفر...</div>';

      db.collection("lessons").orderBy("createdAt", "desc").get()
        .then((querySnapshot) => {
          if (querySnapshot.empty) {
            container.innerHTML = `<div class="text-center text-gray-400 py-4">لا توجد دروس مضافة حالياً 📭</div>`;
            return;
          }

          let html = '';
          querySnapshot.forEach((doc) => {
            const lesson = doc.data();
            html += `
              <div class="flex items-center justify-between p-4 bg-slate-50 border border-gray-200 rounded-xl">
                <div>
                  <span class="inline-block bg-blue-100 text-blue-700 font-bold text-xs px-2.5 py-1 rounded-md mb-1">
                    ${stageNames[lesson.stage] || lesson.stage} - الصف ${lesson.grade}
                  </span>
                  <h4 class="font-bold text-gray-800">${lesson.title}</h4>
                </div>
                <button onclick="deleteLesson('${doc.id}')" class="bg-red-50 text-red-600 border border-red-200 hover:bg-red-600 hover:text-white px-3 py-1.5 rounded-lg font-bold text-sm transition">
                  🗑️ حذف
                </button>
              </div>
            `;
          });
          container.innerHTML = html;
        })
        .catch(err => {
          console.error(err);
          container.innerHTML = `<div class="text-center text-red-500 py-4">حدث خطأ أثناء جلب الدروس</div>`;
        });
    }

    function deleteLesson(id) {
      if (confirm('هل أنت متأكد من حذف هذا الدرس من السيرفر؟')) {
        db.collection("lessons").doc(id).delete()
          .then(() => {
            alert('تم حذف الدرس بنجاح!');
            renderAdminLessons();
          })
          .catch(err => alert('حدث خطأ أثناء الحذف!'));
      }
    }

    /* ----------- 2. وظائف الامتحانات السحابية ----------- */
    let questionCount = 0;
    function addQuestionField() {
      questionCount++;
      const container = document.getElementById('questionsContainer');
      const qDiv = document.createElement('div');
      qDiv.className = "p-4 bg-slate-50 rounded-xl border border-gray-200 space-y-3";
      qDiv.id = `q_block_${questionCount}`;
      
      qDiv.innerHTML = `
        <div class="flex justify-between items-center">
          <span class="font-bold text-sm text-blue-600">السؤال ${questionCount}</span>
          <button type="button" onclick="this.parentElement.parentElement.remove()" class="text-red-500 font-bold text-xs hover:underline">حذف السؤال ❌</button>
        </div>
        <input type="text" class="q-text w-full px-3 py-2 rounded-lg border border-gray-200 text-sm bg-white" placeholder="نص السؤال" required>
        
        <div class="grid grid-cols-2 gap-2">
          <input type="text" class="opt-0 w-full px-3 py-2 rounded-lg border border-gray-200 text-sm bg-white" placeholder="اختيار 1" required>
          <input type="text" class="opt-1 w-full px-3 py-2 rounded-lg border border-gray-200 text-sm bg-white" placeholder="اختيار 2" required>
          <input type="text" class="opt-2 w-full px-3 py-2 rounded-lg border border-gray-200 text-sm bg-white" placeholder="اختيار 3" required>
          <input type="text" class="opt-3 w-full px-3 py-2 rounded-lg border border-gray-200 text-sm bg-white" placeholder="اختيار 4" required>
        </div>

        <select class="correct-opt w-full px-3 py-2 rounded-lg border border-gray-200 text-sm bg-white font-bold text-emerald-700" required>
          <option value="0">الإجابة الصحيحة: اختيار 1</option>
          <option value="1">الإجابة الصحيحة: اختيار 2</option>
          <option value="2">الإجابة الصحيحة: اختيار 3</option>
          <option value="3">الإجابة الصحيحة: اختيار 4</option>
        </select>
      `;
      container.appendChild(qDiv);
    }

    function saveExam(e) {
      e.preventDefault();
      const blocks = document.querySelectorAll('[id^="q_block_"]');
      if (blocks.length === 0) {
        alert('من فضلك أضف سؤالاً واحداً على الأقل!');
        return;
      }

      const submitBtn = document.getElementById('saveExamBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = "⏳ جاري نشر الامتحان...";

      const questions = [];
      blocks.forEach(b => {
        questions.push({
          questionText: b.querySelector('.q-text').value,
          options: [
            b.querySelector('.opt-0').value,
            b.querySelector('.opt-1').value,
            b.querySelector('.opt-2').value,
            b.querySelector('.opt-3').value
          ],
          correctOption: parseInt(b.querySelector('.correct-opt').value)
        });
      });

      const newExam = {
        stage: document.getElementById('examStageInput').value,
        grade: document.getElementById('examGradeInput').value,
        title: document.getElementById('examTitle').value,
        questions: questions,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      db.collection("exams").add(newExam)
        .then(() => {
          alert('تم نشر الامتحان أونلاين بنجاح! 🎉');
          location.reload();
        })
        .catch(err => {
          console.error(err);
          alert('حدث خطأ أثناء حفظ الامتحان!');
          submitBtn.disabled = false;
          submitBtn.innerText = "🚀 نشر الامتحان للطلاب السحابي";
        });
    }

    function renderAdminExams() {
      const container = document.getElementById('adminExamsList');
      container.innerHTML = '<div class="text-center text-gray-400 py-4">⏳ جاري جلب الامتحانات من السيرفر...</div>';

      db.collection("exams").orderBy("createdAt", "desc").get()
        .then((querySnapshot) => {
          if (querySnapshot.empty) {
            container.innerHTML = `<div class="text-center text-gray-400 py-4">لا توجد امتحانات مضافة حالياً 📭</div>`;
            return;
          }

          let html = '';
          querySnapshot.forEach((doc) => {
            const exam = doc.data();
            html += `
              <div class="flex items-center justify-between p-4 bg-slate-50 border border-gray-200 rounded-xl">
                <div>
                  <span class="inline-block bg-blue-100 text-blue-700 font-bold text-xs px-2.5 py-1 rounded-md mb-1">
                    ${stageNames[exam.stage] || exam.stage} - الصف ${exam.grade} (${exam.questions ? exam.questions.length : 0} أسئلة)
                  </span>
                  <h4 class="font-bold text-gray-800">${exam.title}</h4>
                </div>
                <button onclick="deleteExam('${doc.id}')" class="bg-red-50 text-red-600 border border-red-200 hover:bg-red-600 hover:text-white px-3 py-1.5 rounded-lg font-bold text-sm transition">
                  🗑️ حذف
                </button>
              </div>
            `;
          });
          container.innerHTML = html;
        })
        .catch(err => {
          console.error(err);
          container.innerHTML = `<div class="text-center text-red-500 py-4">حدث خطأ أثناء جلب الامتحانات</div>`;
        });
    }

    function deleteExam(id) {
      if (confirm('هل أنت متأكد من حذف هذا الامتحان من السيرفر؟')) {
        db.collection("exams").doc(id).delete()
          .then(() => {
            alert('تم حذف الامتحان بنجاح!');
            renderAdminExams();
          })
          .catch(err => alert('حدث خطأ أثناء الحذف!'));
      }
    }

    // التشغيل المبدئي عند فتح لوحة التحكم
    renderAdminLessons();
    renderAdminExams();
    addQuestionField();
  </script>

</body>
</html>
